basePath: /
definitions:
  gitlab_com_skyrix-lib_template_internal_domain_example_dto.CreateTaskInput:
    properties:
      description:
        maxLength: 4000
        type: string
      title:
        maxLength: 160
        type: string
    required:
    - title
    type: object
  gitlab_com_skyrix-lib_template_internal_domain_example_dto.TaskResult:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      public_id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/handler.FieldError'
        type: array
      message:
        type: string
      request_id:
        type: string
    type: object
  handler.ErrorPayload:
    properties:
      error:
        $ref: '#/definitions/handler.ErrorBody'
    type: object
  handler.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: HTTP API of an application built from the Skyrix framework template.
  title: Skyrix Template API
  version: "1.0"
paths:
  /api/v1/examples/tasks/:
    get:
      description: Returns example tasks in descending creation order.
      parameters:
      - default: 20
        description: Maximum number of tasks
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/gitlab_com_skyrix-lib_template_internal_domain_example_dto.TaskResult'
            type: array
        "401":
          description: missing or invalid token
          schema:
            type: string
        "403":
          description: token role is not allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
      security:
      - BearerAuth: []
      summary: List example tasks
      tags:
      - example tasks
    post:
      consumes:
      - application/json
      description: Creates a task with PENDING status.
      parameters:
      - description: Task payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/gitlab_com_skyrix-lib_template_internal_domain_example_dto.CreateTaskInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gitlab_com_skyrix-lib_template_internal_domain_example_dto.TaskResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
        "401":
          description: missing or invalid token
          schema:
            type: string
        "403":
          description: token role is not allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
      security:
      - BearerAuth: []
      summary: Create an example task
      tags:
      - example tasks
  /api/v1/examples/tasks/{task_id}:
    get:
      description: Returns an example task by its numeric identifier.
      parameters:
      - description: Task ID
        in: path
        minimum: 1
        name: task_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_skyrix-lib_template_internal_domain_example_dto.TaskResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
        "401":
          description: missing or invalid token
          schema:
            type: string
        "403":
          description: token role is not allowed
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
      security:
      - BearerAuth: []
      summary: Get an example task
      tags:
      - example tasks
  /api/v1/examples/tasks/{task_id}/complete:
    patch:
      description: Changes an example task status from PENDING to COMPLETED.
      parameters:
      - description: Task ID
        in: path
        minimum: 1
        name: task_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_skyrix-lib_template_internal_domain_example_dto.TaskResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
        "401":
          description: missing or invalid token
          schema:
            type: string
        "403":
          description: token role is not allowed
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorPayload'
      security:
      - BearerAuth: []
      summary: Complete an example task
      tags:
      - example tasks
securityDefinitions:
  BearerAuth:
    description: 'JWT access token: "Bearer <token>".'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
