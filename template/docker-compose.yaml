name: app

services:
  app:
    build:
      context: ..
      dockerfile: template/infra/go/Dockerfile
    command: ["/app/http"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/config:ro
      - ./secret/jwt_public.pem:/run/secrets/jwt/public.pem:ro
      - ./entrypoints/app-entrypoint.sh:/app/entrypoints/app-entrypoint.sh:ro
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - APP_ENV=local
      - DB_HOST=app-postgres
      - DB_PORT=5432
      - REDIS_HOST=app-redis
      - REDIS_PORT=6379
      - JWT_ALGORITHM=RS256
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt/public.pem
      - JWT_ISSUER=skyrix-auth
    networks:
      skyrix-network:
        aliases:
          - app-api
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: always

  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: skyrix
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    volumes:
      - app_pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyrix -d app -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      skyrix-network:
        aliases:
          - app-postgres

  redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - app_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      skyrix-network:
        aliases:
          - app-redis

volumes:
  app_pgdata:
  app_redisdata:

networks:
  skyrix-network:
    external: true
    name: skyrix-network
