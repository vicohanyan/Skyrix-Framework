APP_ENV: prod
SERVICE_NAME: app

LOGGER:
  LOG_OUTPUT: stdout
  LOG_TYPE: json
  LOG_LEVEL: info
  LOG_DIR: ./logs
  LOG_FILE: app.log

HTTP_SERVER:
  APP_ADDRESS: 0.0.0.0
  APP_PORT: 8080
  APP_REQUEST_TIMEOUT: 5s
  APP_READ_HEADER_TIMEOUT: 10s

DATABASE:
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: skyrix
  DB_PASS: change_me
  DB_NAME: app
  DB_MAIN_SCHEMA: public

REDIS:
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASS: ""
  REDIS_DB: 0
  # Required: root of every Redis key of this service (no default).
  REDIS_KEY_PREFIX: app

JWT:
  JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt/public.pem"
  JWT_EXPIRE: 24
  JWT_ALGORITHM: RS256
  JWT_ISSUER: skyrix-auth
  JWT_AUDIENCE: ""
  # Token roles accepted by the framework auth middleware
  # (extensions/auth/middleware). Empty accepts every role of a valid token.
  # Example: JWT_ALLOWED_ROLES: [customer, admin]
  # or JWT_ALLOWED_ROLES=customer,admin in the environment.
  JWT_ALLOWED_ROLES: []

TENANT_CACHE:
  TENANT_CACHE_TTL: 3m
